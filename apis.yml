name: PitchMe
description: PitchMe is a recruitment data intelligence platform that enriches, verifies,
  and deduplicates candidate records to turn an existing ATS or CRM database into an
  activated talent pool. It cleans and appends verified contact details, employment
  history, and skills data, then surfaces career-intelligence signals that power AI-driven
  sourcing and outreach. PitchMe connects to applicant tracking systems such as Bullhorn,
  Greenhouse, Salesforce, Lever, JobDiva, Vincere, Avionte, Jobvite, and Ashby via native
  and certified integrations, plus a custom API for connecting any ATS or recruitment
  platform. Backed by Techstars.
