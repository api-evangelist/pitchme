apis:
- name: PitchMe API
  description: >-
    PitchMe advertises a "Custom Integration via API" for connecting any ATS or
    recruitment platform not covered by its native marketplace connectors. As of
    2026-08-14 the company publishes no developer portal, no API reference, no
    machine-readable contract and no base URL; the only public entry point is a
    "DISCUSS CUSTOM INTEGRATION" sales CTA on the integrations page. api.pitchme.co
    resolves and fronts a live application, but every anonymous path returns 404, and
    PitchMe's own docs never name a base URL — so baseURL is deliberately left unset
    rather than guessed from the domain.
  humanURL: https://pitchme.co/integrations
  baseURL: ''
  x-base-url-status: missing
  x-base-url-note: >-
    No PitchMe source (website, blog, marketplace listing, or any /.well-known
    document) states an API base URL. api.pitchme.co was observed live but is
    unconfirmed as the customer-facing base.
  properties: []
