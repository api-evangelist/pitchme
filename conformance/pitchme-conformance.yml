note: >-
  PitchMe publishes named compliance claims as trust badges on its marketing pages —
  "GDPR Compliant", "SOC 2 Type", "ISO 27001", plus a written commitment to "full
  compliance indemnification — GDPR, CCPA, and sector-specific requirements". These
  are the provider's own published statements and are recorded as such. There is no
  trust center, no security page, no published audit report or certificate, and no
  mechanism to request one anonymously — probe-security-programs.py found neither a
  vulnerability-disclosure program nor a trust center on any PitchMe host. There is
  also no public API contract, so none of the API-level standards below could be
  derived from a specification; each is recorded as unknown rather than false where
  no evidence exists in either direction.
